<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F1FF">
<title>Colour by Number — LokaKids</title>
<meta name="description" content="Colour a unicorn, caterpillar, butterfly or fish by following the number key: 1 is red, 2 is blue, 3 is yellow…">
<link rel="icon" href="images/characters/image_ComfyUI_00005__extracted.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/color.css">
</head>
<body>

<div class="decor" aria-hidden="true">
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>
</div>

<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" href="index.html" aria-label="Back to LokaKids home">
            <span class="brand__mark"><img src="images/characters/image_ComfyUI_00005__extracted.png" alt=""></span>
            <span>
                <span class="brand__name">Colour by Number</span>
                <span class="brand__tag">1 = red · 2 = blue</span>
            </span>
        </a>
        <span class="topbar__spacer"></span>
        <div class="topbar__tools">
            <span class="star-count" data-star-total title="Stars you have collected">
                ⭐ <span class="star-count__num">0</span>
            </span>
            <button class="btn btn--icon" data-sound-toggle type="button" aria-pressed="true">🔊</button>
            <a class="btn btn--icon" href="index.html" title="Back to menu" aria-label="Back to menu">🏠</a>
        </div>
    </div>
</header>

<main class="shell studio">

    <!-- Picture chooser -->
    <div class="picker" id="picker" role="group" aria-label="Choose a picture"></div>

    <!-- Colouring sheet -->
    <section class="sheet">
        <div class="sheet__paper" id="paper"></div>
        <div class="sheet__foot">
            <span class="sheet__count" id="sheetCount">0 of 0 coloured</span>
            <div class="bar"><div class="bar__fill" id="barFill"></div></div>
        </div>
    </section>

    <!-- Colour key -->
    <section class="key">
        <div>
            <h2 class="key__title">🎨 Colour key <small>tap a number</small></h2>
            <div class="key__list" id="keyList" role="group" aria-label="Colour key"></div>
        </div>

        <p class="key__hint" id="keyHint" aria-live="polite"></p>

        <div class="key__actions">
            <button class="btn btn--ghost" type="button" id="btnClear">Start over 🔄</button>
            <button class="btn btn--primary" type="button" id="btnSave">Save 📸</button>
        </div>
    </section>

</main>

<footer class="site-footer">
    <p>⭐ 2 stars for a picture with no mix-ups, 1 star otherwise · <a href="index.html">Back to all games</a></p>
</footer>

<!-- Finished -->
<div class="modal" id="doneModal" role="dialog" aria-modal="true" aria-labelledby="doneTitle" hidden>
    <div class="modal__card">
        <div id="doneArt"></div>
        <h2 class="modal__title" id="doneTitle">All coloured in!</h2>
        <p class="modal__text" id="doneText">Your picture looks wonderful.</p>
        <p class="stage__stars" id="doneStars" aria-hidden="true"></p>
        <div class="modal__actions">
            <button class="btn btn--primary" type="button" id="btnNextPic">Next picture 🦋</button>
            <button class="btn btn--candy" type="button" id="btnSaveDone">Save my picture 📸</button>
            <button class="btn btn--ghost" type="button" id="btnStay">Look at it ✨</button>
        </div>
    </div>
</div>

<script src="js/kid.js"></script>
<script src="js/color-pictures.js"></script>
<script src="js/color.js"></script>
</body>
</html>
