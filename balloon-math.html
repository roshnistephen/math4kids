<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F1FF">
<title>Balloon Math — LokaKids</title>
<meta name="description" content="Pop and count balloons to practise adding and taking away. Ten questions a round, gentle hints, and stars to collect.">
<link rel="icon" href="images/characters/image_ComfyUI_00006__extracted.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/balloon.css">
</head>
<body>

<div class="decor" aria-hidden="true">
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>
</div>

<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" href="index.html" aria-label="Back to LokaKids home">
            <span class="brand__mark"><img src="images/characters/image_ComfyUI_00006__extracted.png" alt=""></span>
            <span>
                <span class="brand__name">Balloon Math</span>
                <span class="brand__tag">Pop · count · solve</span>
            </span>
        </a>
        <span class="topbar__spacer"></span>
        <div class="topbar__tools">
            <span class="star-count" data-star-total title="Stars you have collected">
                ⭐ <span class="star-count__num">0</span>
            </span>
            <button class="btn btn--icon" data-sound-toggle type="button" aria-pressed="true">🔊</button>
            <a class="btn btn--icon" href="index.html" title="Back to menu" aria-label="Back to menu">🏠</a>
        </div>
    </div>
</header>

<main class="shell game">

    <!-- Mode + level -->
    <section class="setup" id="setup">
        <div class="switcher" role="radiogroup" aria-label="Choose what to practise">
            <button class="switcher__btn" type="button" role="radio" data-mode="sub" aria-checked="true">➖ Take away</button>
            <button class="switcher__btn" type="button" role="radio" data-mode="add" aria-checked="false">➕ Add up</button>
        </div>
        <div class="switcher" role="radiogroup" aria-label="Choose a number range">
            <button class="switcher__btn" type="button" role="radio" data-level="1" aria-checked="true">🐣 Up to 5</button>
            <button class="switcher__btn" type="button" role="radio" data-level="2" aria-checked="false">🚀 Up to 10</button>
        </div>
    </section>

    <!-- Question -->
    <section class="board">
        <div class="board__progress">
            <div class="pips" id="pips" aria-hidden="true"></div>
            <p class="board__count" id="questionCount">Question 1 of 10</p>
        </div>
        <p class="equation" id="equation" aria-live="polite"></p>
        <p class="instruction" id="instruction" aria-live="polite"></p>
    </section>

    <!-- Balloons -->
    <section class="arena-card">
        <div class="arena" id="arena" aria-label="Balloons"></div>
    </section>

    <!-- Answers -->
    <section class="answers" id="answers" aria-label="Answer choices" hidden></section>

    <!-- Controls -->
    <section class="game-foot">
        <span class="streak" id="streak" hidden>🔥 <span id="streakNum">0</span> in a row!</span>
        <button class="btn btn--ghost" type="button" id="btnSkip">I know it 💡</button>
        <button class="btn btn--primary" type="button" id="btnNext" disabled>Next question ➡</button>
    </section>

</main>

<footer class="site-footer">
    <p>⭐ 2 stars for a first-try answer, 1 star after a hint · <a href="index.html">Back to all games</a></p>
</footer>

<!-- Round results -->
<div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
    <div class="modal__card">
        <p class="modal__emoji" id="resultEmoji">🏆</p>
        <h2 class="modal__title" id="resultTitle">Perfect round!</h2>
        <p class="result__ribbon" id="resultRibbon">Round complete</p>

        <div class="result__score">
            <div class="result__stat"><b id="resultStars">0</b><span>stars earned</span></div>
            <div class="result__stat"><b id="resultFirst">0/10</b><span>first try</span></div>
            <div class="result__stat"><b id="resultBest">0</b><span>best streak</span></div>
        </div>

        <div class="modal__actions">
            <button class="btn btn--primary" type="button" id="btnAgain">Play again 🎈</button>
            <button class="btn btn--ghost" type="button" id="btnSwitch">Change mode 🔀</button>
            <a class="btn btn--ghost" href="index.html">Back to menu 🏠</a>
        </div>
    </div>
</div>

<script src="js/kid.js"></script>
<script src="js/balloon.js"></script>
</body>
</html>
